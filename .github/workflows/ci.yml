name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ttunes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ttunes_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # The Pg suite wipes this DB; its name must contain "test".
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ttunes_test
      TEST_S3_ENDPOINT: http://127.0.0.1:9000
      TEST_S3_BUCKET: ttunes-test
      TEST_S3_ACCESS_KEY_ID: minioadmin
      TEST_S3_SECRET_ACCESS_KEY: minioadmin
    steps:
      - uses: actions/checkout@v4

      # Service containers can't take a command, and MinIO needs `server /data`.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            chainguard/minio:latest server /data --address :9000
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 1
          done
          docker logs minio
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npx vite build

      - name: Tests (Postgres + S3 suites included)
        run: npx vitest run --reporter=default --reporter=json --outputFile=vitest-results.json

      - name: Fail if any test was skipped
        run: node scripts/assert-no-skipped-tests.mjs vitest-results.json

  # The M1 UI gate: real server serving dist/, Chromium on a phone and a desktop viewport.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_SHOTS: ${{ github.workspace }}/e2e-shots
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Playwright version
        id: pw
        run: echo "version=$(node -p 'require("playwright/package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # --with-deps also installs the system libraries, which aren't cached, so run it every time.
      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e-shots/
          if-no-files-found: warn

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ttunes:local .
      - name: Smoke test (compose app + Postgres + MinIO)
        run: SMOKE_BUILD=0 scripts/smoke.sh
