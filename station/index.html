<!doctype html>
<html lang="en" data-layout="side">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Instrument+Serif:ital@1&family=Archivo:wght@500;600;700;800&family=Barlow+Condensed:wght@500;600;700&family=Bungee&family=Bungee+Shade&display=swap" />
    <script>
      // Set the saved look before first paint (no flash). Afterglow when nothing is saved or storage is blocked.
      try { document.documentElement.dataset.look = localStorage.getItem("ttunes.look") === "theset" ? "theset" : "afterglow"; } catch (e) { document.documentElement.dataset.look = "afterglow"; }
    </script>
    <title>TTunes station</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
