<!doctype html>
<html lang="en" data-layout="side" data-panel="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Instrument+Serif:ital@1&family=Archivo:wght@500;600;700;800&family=Barlow+Condensed:wght@500;600;700&family=Bungee&family=Bungee+Shade&display=swap" />
    <script>
      // Set the saved look before first paint (no flash). Afterglow when nothing is saved or storage is blocked.
      try { document.documentElement.dataset.look = localStorage.getItem("ttunes.look") === "theset" ? "theset" : "afterglow"; } catch (e) { document.documentElement.dataset.look = "afterglow"; }
    </script>
    <script>
      // Same for the layout: Side unless "stacked" was saved.
      try { document.documentElement.dataset.layout = localStorage.getItem("ttunes.layout") === "stacked" ? "stacked" : "side"; } catch (e) { document.documentElement.dataset.layout = "side"; }
    </script>
    <script>
      // Same for the Afterglow panel colour: Dark tinted unless one of the other four was saved.
      (function () {
        try { var p = localStorage.getItem("ttunes.panel"); document.documentElement.dataset.panel = ["black", "frosted", "cream", "yellow"].indexOf(p) >= 0 ? p : "dark"; } catch (e) { document.documentElement.dataset.panel = "dark"; }
      })();
    </script>
    <title>TTunes station</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
